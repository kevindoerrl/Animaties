<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter700.ttf)}
@font-face{font-family:Inter;font-weight:900;src:url(fonts/inter900.ttf)}
:root{--groen:#3A8A3E;--rood:#C0182E;--geel:#F2C814;--donker:#15130F;--wit:#FFF8EC}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.abs{position:absolute}
</style></head>
<body>
<!--
  Short-edit (Tropical Caribbean Products × AC's BBQ) · eindkaart over het zwarte stuk 18,07 → 22,12 s
  1080×1920 @ 60fps · MOV start op 0 = 18,07 s in de edit (243 frames, 4,05 s)
  Lokale tijd u (0 = 18,07):
    0,00  "namelijk nu"       achtergrond veegt in + AC's BBQ × Tropical-lockup
    0,75  "een kortingscode"  kortingsbon schuift omhoog
    1,48  "ac15"              code AC15 knalt erop
    2,25  "voor 15%"          15%-badge telt op en slaat erop
    2,91  "korting"           KORTING in de badge
    3,36  "dus wees snel!"    rode timerring loopt leeg, bon schudt
  Ondertitels in de edit staan op y≈870–1030: die band blijft vrij.
-->
<div id="bg" class="abs" style="inset:0;background:radial-gradient(ellipse 80% 55% at 50% 42%,#3A2414 0%,#1E1610 45%,var(--donker) 100%)">
  <div class="abs" style="left:0;right:0;bottom:0;height:520px;background:linear-gradient(transparent,rgba(192,24,46,.20))"></div>
  <div id="vonken"></div>
</div>

<!-- lockup -->
<div id="lock" class="abs" style="left:0;right:0;top:250px;height:520px">
  <img id="acs" class="abs" src="acsbbq_logo.png" style="left:110px;top:40px;width:420px;height:420px;border-radius:36px;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 6px rgba(242,200,20,.85)">
  <div id="kruis" class="abs" style="left:520px;top:180px;width:90px;text-align:center;font:400 110px/1 Anton;color:var(--geel)">×</div>
  <div id="trop" class="abs" style="left:610px;top:150px;width:360px;height:200px;border-radius:30px;background:#fff;box-shadow:0 26px 50px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center">
    <img src="tropical_logo.png" style="width:300px">
  </div>
</div>

<!-- kortingsbon -->
<div id="bon" class="abs" style="left:110px;top:1110px;width:860px;height:470px;transform-origin:50% 50%">
  <svg class="abs" width="860" height="470" style="left:0;top:0;overflow:visible;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6))">
    <defs><linearGradient id="bonbg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#F3E9D2"/></linearGradient></defs>
    <path d="M30 0 H830 Q860 0 860 30 V200 A35 35 0 0 0 860 270 V440 Q860 470 830 470 H30 Q0 470 0 440 V270 A35 35 0 0 0 0 200 V30 Q0 0 30 0 Z" fill="url(#bonbg)"/>
    <path d="M30 0 H830 Q860 0 860 30 V200 A35 35 0 0 0 860 270 V440 Q860 470 830 470 H30 Q0 470 0 440 V270 A35 35 0 0 0 0 200 V30 Q0 0 30 0 Z" fill="none" stroke="var(--groen)" stroke-width="10"/>
    <line x1="60" y1="235" x2="800" y2="235" stroke="#C9B990" stroke-width="5" stroke-dasharray="18 14"/>
    <rect x="0" y="0" width="860" height="18" rx="9" fill="var(--rood)"/>
  </svg>
  <div class="abs" style="left:64px;top:62px;font:900 44px/1 Inter;letter-spacing:10px;color:var(--groen)">KORTINGSCODE</div>
  <div id="code" class="abs" style="left:0;right:0;top:262px;height:190px;text-align:center;font:400 190px/190px Anton;letter-spacing:14px;color:var(--donker);white-space:nowrap;overflow:hidden"></div>
  <div id="glans" class="abs" style="top:0;width:200px;height:470px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);mix-blend-mode:screen"></div>
</div>

<!-- 15%-badge -->
<div id="badge" class="abs" style="left:690px;top:1040px;width:340px;height:340px;margin:0;transform-origin:50% 50%">
  <svg class="abs" width="340" height="340" viewBox="-170 -170 340 340" style="left:0;top:0;overflow:visible">
    <path id="ster" fill="var(--geel)" stroke="#8A6A00" stroke-width="6"/>
    <circle id="ring" r="158" fill="none" stroke="var(--rood)" stroke-width="16" stroke-linecap="round" transform="rotate(-90)"/>
  </svg>
  <div id="pct" class="abs" style="left:0;right:0;top:92px;text-align:center;font:400 128px/1 Anton;color:var(--rood);text-shadow:0 5px 0 rgba(0,0,0,.18)">0%</div>
  <div id="kort" class="abs" style="left:0;right:0;top:226px;text-align:center;font:900 32px/1 Inter;letter-spacing:5px;color:var(--donker)">KORTING</div>
</div>

<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease={outExpo:x=>x>=1?1:1-Math.pow(2,-10*x), inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  outBack:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, outCubic:x=>1-Math.pow(1-x,3)};
const eased=(t,a,b,f)=>f(clamp((t-a)/(b-a)));
const lerp=(a,b,p)=>a+(b-a)*p;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const FPS=60, D=243/FPS;
const T={lock:0.05, kruis:0.28, trop:0.33, bon:0.75, code:1.48, pct:2.25, kort:2.91, snel:3.36};
const CODE='AC15';

function setup(){
  // starburst
  let d=''; const n=20;
  for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2, r=i%2?128:150; d+=(i?'L':'M')+(Math.cos(a)*r).toFixed(1)+' '+(Math.sin(a)*r).toFixed(1)+' ';}
  document.getElementById('ster').setAttribute('d',d+'Z');
  const ring=document.getElementById('ring'); const L=2*Math.PI*158; ring.style.strokeDasharray=L; ring.dataset.len=L;
  document.getElementById('code').innerHTML=[...CODE].map(c=>`<span class="l" style="display:inline-block">${c}</span>`).join('');
  document.getElementById('vonken').innerHTML=Array.from({length:46},()=>`<div class="abs v" style="border-radius:50%;background:radial-gradient(circle,#FFE08A,#FF7A1A 55%,rgba(255,80,0,0) 72%)"></div>`).join('');
}

function render(_,u){
  // achtergrond: diagonale veeg van linksonder naar rechtsboven
  const w=eased(u,0,0.26,ease.outExpo);
  const bg=document.getElementById('bg');
  const p=lerp(-60,160,w);
  bg.style.clipPath=`polygon(0% 100%, 0% ${100-p*1.25}%, ${p*1.25}% 100%)`;
  if(w>=0.999) bg.style.clipPath='none';
  // vonken stijgen op (sneller bij "wees snel")
  const snel=eased(u,T.snel,T.snel+0.3,ease.outCubic);
  document.querySelectorAll('#vonken .v').forEach((v,i)=>{
    const sp=(140+rnd(i)*260)*(1+snel*1.6), r=3+rnd(i+20)*7, ph=rnd(i+40)*1920;
    const y=1980-((ph+u*sp)%2050), x=rnd(i+60)*1080+Math.sin(u*2+i)*30;
    v.style.width=v.style.height=r*2+'px'; v.style.left=(x-r)+'px'; v.style.top=(y-r)+'px';
    v.style.opacity=(0.35+0.65*rnd(i+80))*w;
  });

  // lockup
  const a=eased(u,T.lock,T.lock+0.45,ease.outBack), az=eased(u,T.lock,T.lock+0.3,ease.outExpo);
  const acs=document.getElementById('acs');
  acs.style.transform=`translateY(${Math.sin(u*1.6)*5}px) rotate(${lerp(-14,-3,a)}deg) scale(${lerp(1.9,1,az)*lerp(0.5,1,a)})`;
  acs.style.filter=`blur(${lerp(18,0,az)}px)`; acs.style.opacity=u<T.lock?0:Math.min(az*1.6,1);
  const k=eased(u,T.kruis,T.kruis+0.3,ease.outBack);
  document.getElementById('kruis').style.transform=`scale(${k}) rotate(${lerp(-90,0,k)}deg)`;
  const tr=eased(u,T.trop,T.trop+0.45,ease.outBack), tz=eased(u,T.trop,T.trop+0.3,ease.outExpo);
  const trop=document.getElementById('trop');
  trop.style.transform=`translateY(${Math.sin(u*1.6+1)*5}px) rotate(${lerp(14,3,tr)}deg) scale(${lerp(1.9,1,tz)*lerp(0.5,1,tr)})`;
  trop.style.filter=`blur(${lerp(18,0,tz)}px)`; trop.style.opacity=u<T.trop?0:Math.min(tz*1.6,1);

  // bon
  const b=eased(u,T.bon,T.bon+0.5,ease.outBack), bz=eased(u,T.bon,T.bon+0.32,ease.outExpo);
  const shake=u>T.snel?Math.sin(u*60)*Math.exp(-(u-T.snel)*3)*7:0;
  const bon=document.getElementById('bon');
  bon.style.transform=`translate(${shake}px,${lerp(700,0,b)}px) rotate(${lerp(10,-2,b)+shake*0.15}deg) scale(${lerp(1.3,1,bz)})`;
  bon.style.filter=`blur(${lerp(12,0,bz)}px)`; bon.style.opacity=u<T.bon?0:1;
  // code letters
  document.querySelectorAll('#code .l').forEach((l,i)=>{
    const st=T.code+i*0.06, q=eased(u,st,st+0.28,ease.outBack), z=eased(u,st,st+0.18,ease.outExpo);
    l.style.transform=`translateY(${lerp(-120,0,q)}px) scale(${lerp(2.4,1,z)})`; l.style.opacity=u<st?0:Math.min(z*1.8,1);
    l.style.filter=`blur(${lerp(10,0,z)}px)`;
  });
  const gl=eased(u,T.code+0.35,T.code+0.85,ease.inOutCubic);
  const glans=document.getElementById('glans'); glans.style.left=lerp(-260,920,gl)+'px'; glans.style.opacity=(gl>0&&gl<1)?1:0;

  // badge 15%
  const g=eased(u,T.pct,T.pct+0.4,ease.outBack), gz=eased(u,T.pct,T.pct+0.25,ease.outExpo);
  const pulse=u>T.snel?1+0.06*Math.abs(Math.sin((u-T.snel)*9)):1;
  const badge=document.getElementById('badge');
  badge.style.transform=`rotate(${lerp(-40,8,g)+Math.sin(u*2)*2}deg) scale(${lerp(2.6,1,gz)*lerp(0.3,1,g)*pulse})`;
  badge.style.filter=`blur(${lerp(16,0,gz)}px)`; badge.style.opacity=u<T.pct?0:Math.min(gz*1.6,1);
  document.getElementById('ster').setAttribute('transform',`rotate(${u*20})`);
  document.getElementById('pct').textContent=Math.round(15*eased(u,T.pct+0.05,T.pct+0.45,ease.outCubic))+'%';
  const ko=eased(u,T.kort,T.kort+0.3,ease.outBack), kor=document.getElementById('kort');
  kor.style.transform=`scale(${lerp(0.2,1,ko)})`; kor.style.opacity=u<T.kort?0:1;
  // timerring: loopt leeg vanaf "wees snel"
  const ring=document.getElementById('ring'), L=+ring.dataset.len;
  const rv=eased(u,T.snel,T.snel+0.2,ease.outCubic), rl=eased(u,T.snel+0.1,D,x=>x);
  ring.style.opacity=rv; ring.style.strokeDashoffset=L*rl;
}
window.init=async()=>{ for(const i of document.images){ if(!i.complete) await new Promise(r=>i.onload=r); await i.decode(); }
  await document.fonts.load('100px Anton'); await document.fonts.load('900 40px Inter'); await document.fonts.ready; setup(); };
window.render=render; window.D=D;
</script>
</body></html>
